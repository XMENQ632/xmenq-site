<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XMENQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:monospace;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{position:fixed;top:0;left:0;z-index:-1}
.box{text-align:center;border:1px solid #0f0;padding:40px;background:rgba(0,0,0,0.9);box-shadow:0 0 40px #0f0;max-width:90%}
h1{font-size:70px;letter-spacing:10px;text-shadow:0 0 20px #0f0}
#t{color:#0ff;margin:20px;font-size:18px;min-height:25px}
a{display:inline-block;margin:8px;padding:10px 25px;border:1px solid #0f0;color:#0f0;text-decoration:none}
a:hover{background:#0f0;color:#000}
</style>
</head>
<body>
<canvas id="m"></canvas>
<div class="box">
<h1>XMENQ</h1>
<div id="t"></div>
<div><a href="#">INSTAGRAM</a><a href="#">GITHUB</a></div>
<div style="margin-top:20px;font-size:10px;opacity:.4">88 // ACCESS GRANTED</div>
</div>
<script>
c=document.getElementById("m");x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
d=Array(c.width/14|0).fill(1);
setInterval(()=>{x.fillStyle="rgba(0,0,0,0.08)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#0f0";x.font="14px monospace";d.forEach((y,i)=>{x.fillText("XMENQ88"[Math.random()*7|0],i*14,y*14);if(y*14>c.height&&Math.random()>0.97)d[i]=0;d[i]++})},33);
ts=["SYSTEM ACCESS: GRANTED","XMENQ NETWORK ONLINE","88"];ti=0;ci=0;el=document.getElementById("t");
(function loop(){if(ci<=ts[ti].length){el.innerHTML=ts[ti].substring(0,ci)+"█";ci++;setTimeout(loop,90)}else{setTimeout(()=>{ci=0;ti=(ti+1)%ts.length;loop()},1500)}})();
</script>
</body>
</html>
