<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:'Courier New',monospace;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{position:fixed;top:0;left:0;z-index:-1}
.box{text-align:center;border:1px solid #0f0;padding:40px 30px;background:rgba(0,0,0,0.85);box-shadow:0 0 40px #0f0;max-width:90%}
h1{font-size:75px;letter-spacing:10px;text-shadow:0 0 25px #0f0}
#typed{color:#0ff;font-size:18px;margin:20px 0;min-height:25px}
.links a{display:inline-block;margin:8px;padding:12px 28px;border:1px solid #0f0;color:#0f0;text-decoration:none;transition:.3s}
.links a:hover{background:#0f0;color:#000;box-shadow:0 0 20px #0f0}

.blink{animation:blink 1s infinite} @keyframes blink{50%{opacity:0}}

<body>
<canvas id="matrix"></canvas>
<div class="box">
<h1>XMENQ</h1>
<div id="typed"></div>
<div class="links">
<a href="https://instagram.com/xmenq88">INSTAGRAM</a>
<a href="https://github.com/XMENQ632">GITHUB</a>
<a href="#">CONTACT</a>
</div>
<div class="footer">SANLIURFA // 88 // SYSTEM ONLINE<span class="blink">_</span></div>
</div>
<script>
const c=document.getElementById("matrix"),x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let drops=Array(Math.floor(c.width/14)).fill(1);
setInterval(()=>{
x.fillStyle="rgba(0,0,0,0.08)";x.fillRect(0,0,c.width,c.height);
x.fillStyle="#0f0";x.font="14px monospace";
drops.forEach((y,i)=>{
x.fillText(Math.random()>0.5?"1":"0",i*14,y*14);
if(y*14>c.height && Math.random()>0.975) drops[i]=0;
drops[i]++;
});
},35);
const texts=["SYSTEM ACCESS: GRANTED","WELCOME TO XMENQ NETWORK","SANLIURFA // 88"];
let ti=0,ci=0,el=document.getElementById("typed");
function type(){
if(ci<=texts[ti].length){
el.innerHTML=texts[ti].substring(0,ci)+'<span class="blink">█</span>';
ci++; setTimeout(type,80);
}else{
setTimeout(()=>{ci=0;ti=(ti+1)%texts.length;type()},1500);
}
}
type();
</script>
